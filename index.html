<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LeafCon AR</title>
<meta name="description" content="LeafCon: the air-con made of leaves. Place a tree or plant around you in AR.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Instrument+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>
  :root {
    --green: #2F7D4F;
    --green-dark: #1F5A38;
    --ink: #17221B;
    --muted: #5B6B60;
    --bg: #F6F8F4;
    --card: #FFFFFF;
    --line: #DCE4DC;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Instrument Sans", system-ui, -apple-system, sans-serif;
    min-height: 100dvh; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 16px calc(16px + env(safe-area-inset-bottom));
  }
  header { padding: 20px 0 8px; }
  .brand { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 700; font-size: 28px; color: var(--green); letter-spacing: -0.02em; }
  .claim { margin: 2px 0 0; font-size: 16px; color: var(--muted); }
  .label { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 16px 0 8px; }
  .picker { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .picker button {
    font: inherit; font-size: 14px; font-weight: 600; color: var(--ink);
    background: var(--card); border: 2px solid var(--line); border-radius: 12px;
    padding: 10px 4px; cursor: pointer; min-height: 48px;
  }
  .picker button[aria-pressed="true"] { border-color: var(--green); color: var(--green); }
  .size { display: block; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; font-weight: 500; color: var(--muted); margin-top: 2px; }
  model-viewer {
    flex: 1; width: 100%; min-height: 320px; margin-top: 12px;
    background: linear-gradient(#EAF2EA, #F6F8F4); border-radius: 16px;
    --poster-color: transparent;
  }
  .ar-btn {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    font: inherit; font-size: 17px; font-weight: 600; color: #fff;
    background: var(--green); border: 0; border-radius: 999px;
    padding: 14px 24px; white-space: nowrap; box-shadow: 0 4px 16px rgba(23,34,27,.25);
  }
  .ar-btn:active { background: var(--green-dark); }
  .no-ar { margin: 12px 0 0; font-size: 14px; color: var(--muted); text-align: center; }
  .help { margin: 12px 0 0; font-size: 14px; color: var(--muted); line-height: 1.4; }
  footer { margin-top: 12px; font-size: 11px; color: var(--muted); text-align: center; }
  footer a { color: inherit; }
</style>
</head>
<body>
<header>
  <div class="brand">LeafCon</div>
  <p class="claim">The air-con made of leaves.</p>
</header>

<div class="label">1 · Pick a plant</div>
<div class="picker" role="group" aria-label="Plant">
  <button type="button" data-src="models/tree_oak.glb" data-name="City tree" aria-pressed="true">Tree<span class="size">~6 m</span></button>
  <button type="button" data-src="models/plant_bushLarge.glb" data-name="Bush" aria-pressed="false">Bush<span class="size">~1.2 m</span></button>
  <button type="button" data-src="models/plant_flatTall.glb" data-name="Plant" aria-pressed="false">Plant<span class="size">~0.8 m</span></button>
  <button type="button" data-src="models/flower_yellowA.glb" data-name="Flowers" aria-pressed="false">Flowers<span class="size">~0.4 m</span></button>
</div>

<div class="label">2 · Place it around you</div>
<model-viewer id="mv"
  src="models/tree_oak.glb"
  alt="A 3D tree from LeafCon"
  ar ar-modes="webxr scene-viewer quick-look"
  ar-placement="floor" ar-scale="fixed"
  camera-controls touch-action="pan-y" auto-rotate
  shadow-intensity="1" exposure="1.1"
  camera-orbit="30deg 75deg auto">
  <button slot="ar-button" class="ar-btn">Place in my space</button>
</model-viewer>
<p class="no-ar" id="noAr" hidden>AR needs a phone. Scan the QR code with your phone camera.</p>
<p class="help">Point the camera at the floor and move the phone slowly. The plant shows at real size. Walk around it.</p>

<footer>3D models: <a href="https://kenney.nl">Kenney</a> (CC0). Uni project, HsH Hannover.</footer>

<script>
  const mv = document.getElementById('mv');
  document.querySelectorAll('.picker button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.picker button').forEach(b => b.setAttribute('aria-pressed', 'false'));
      btn.setAttribute('aria-pressed', 'true');
      mv.src = btn.dataset.src;
      mv.alt = 'A 3D ' + btn.dataset.name.toLowerCase() + ' from LeafCon';
    });
  });
  mv.addEventListener('load', () => {
    document.getElementById('noAr').hidden = mv.canActivateAR;
  });
</script>
</body>
</html>
